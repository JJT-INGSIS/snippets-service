spring.application.name=snippets-service
snippets.cors.allowed-origins=${SNIPPETS_CORS_ALLOWED_ORIGINS:}
language.printscript.base-url=${PRINTSCRIPT_BASE_URL:http://localhost:8082}
snippets.outbox.enabled=${SNIPPETS_OUTBOX_ENABLED:false}
snippets.outbox.stream=${SNIPPETS_OUTBOX_STREAM:snippet-searcher:local:events}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s

# Bound the public stream above the interpreter deadline and reconnect window.
spring.mvc.async.request-timeout=${EXECUTION_STREAM_HTTP_TIMEOUT:140s}
