name: Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publicar una imagen de bootstrap despuÃ©s de CI; solo desde dev.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    permissions:
      contents: read
      packages: write
      actions: read
      pull-requests: read
      deployments: write
    uses: JJT-INGSIS/github-workflows/.github/workflows/kotlin-service-pipeline.yml@6f520b81c7774a844c4c522cc96eb93c60ccfec9
    with:
      publish: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/dev') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
      deploy: ${{ vars.CD_ENABLED == 'true' }}
      image-name: ghcr.io/jjt-ingsis/snippets-service
      platforms: ${{ vars.DOCKER_PLATFORMS || 'linux/amd64' }}
    secrets:
      GH_PACKAGES_USER: ${{ secrets.GH_PACKAGES_USER }}
      GH_PACKAGES_READ_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
