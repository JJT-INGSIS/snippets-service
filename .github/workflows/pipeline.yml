name: Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publicar una imagen de bootstrap después de CI; solo desde dev o main.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    permissions:
      contents: read
      packages: write
    uses: JJT-INGSIS/github-workflows/.github/workflows/kotlin-service-pipeline.yml@73cc46862500f0cd19736f047d834ea7738d6021
    with:
      publish: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/dev') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
      image-name: ghcr.io/jjt-ingsis/snippets-service
      platforms: ${{ vars.DOCKER_PLATFORMS || 'linux/amd64' }}
    secrets:
      GH_PACKAGES_USER: ${{ secrets.GH_PACKAGES_USER }}
      GH_PACKAGES_READ_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN }}
